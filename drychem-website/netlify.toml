# Netlify build settings. The site is a static export: `next build` writes it to out/.
# Set NEXT_PUBLIC_SITE_URL (and SITE_NOINDEX=1 for previews) in the site's environment
# variables, not here.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Fully static, so Netlify's Next.js server runtime isn't needed.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Hashed build assets never change, so they can be cached for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
